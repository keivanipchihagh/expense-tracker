name: expense-tracker

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ghcr.io/keivanipchihagh/expense-tracker:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    env_file: ../.env
    volumes:
      - ../data:/data
