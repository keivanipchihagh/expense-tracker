services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ghcr.io/keivanipchihagh/expense-tracker:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    env_file: .env
    environment:
      EXPENSE_TRACKER_SQLITE_PATH: /data/expense.db
      EXPENSE_TRACKER_FIELDS_PATH: /config/fields.yaml
    volumes:
      - ./data:/data
      - ./config/fields.yaml:/config/fields.yaml:ro
