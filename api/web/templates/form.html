{{define "form"}}
<section class="card editor">
  <h2>{{if .Id}}Edit expense{{else}}Add expense{{end}}</h2>
  {{if .Errors}}<p class="error" role="alert">Please fix the highlighted fields.</p>{{end}}
  <form {{if .Id}}hx-post="/ui/expenses/{{.Id}}"{{else}}hx-post="/ui/expenses"{{end}} hx-target="#editor">
    <input type="hidden" name="from" value="{{.Range.From}}">
    <input type="hidden" name="to" value="{{.Range.To}}">
    <input type="hidden" name="tz_offset" value="{{.Values.TzOffset}}">

    <div class="grid">
      <label class="{{if index .Errors "amount"}}invalid{{end}}">Amount
        <input name="amount" inputmode="decimal" value="{{.Values.Amount}}" placeholder="12.50" required>
        {{with index .Errors "amount"}}<small class="error">{{.}}</small>{{end}}
      </label>

      <label class="{{if index .Errors "currency"}}invalid{{end}}">Currency
        <select name="currency">
          {{range .Currencies}}<option value="{{.Code}}" {{if eq .Code $.Values.Currency}}selected{{end}}>{{.Code}} ({{.Symbol}})</option>{{end}}
        </select>
        {{with index .Errors "currency"}}<small class="error">{{.}}</small>{{end}}
      </label>

      <label class="{{if index .Errors "occurred_at"}}invalid{{end}}">When
        <input type="datetime-local" name="occurred_local" step="1" value="{{.Values.OccurredLocal}}" required>
        {{with index .Errors "occurred_at"}}<small class="error">{{.}}</small>{{end}}
      </label>

      <label class="{{if index .Errors "category"}}invalid{{end}}">Category
        <select name="category">
          {{range .Categories}}<option value="{{.}}" {{if eq . $.Values.Category}}selected{{end}}>{{.}}</option>{{end}}
        </select>
        {{with index .Errors "category"}}<small class="error">{{.}}</small>{{end}}
      </label>

      <label class="wide {{if index .Errors "merchant"}}invalid{{end}}">Merchant
        <input name="merchant" value="{{.Values.Merchant}}" maxlength="200" placeholder="Optional">
        {{with index .Errors "merchant"}}<small class="error">{{.}}</small>{{end}}
      </label>

      <label class="wide {{if index .Errors "note"}}invalid{{end}}">Note
        <textarea name="note" rows="2" maxlength="2000" placeholder="Optional">{{.Values.Note}}</textarea>
        {{with index .Errors "note"}}<small class="error">{{.}}</small>{{end}}
      </label>
    </div>

    <div class="buttons">
      <button type="submit" class="primary">{{if .Id}}Save changes{{else}}Add expense{{end}}</button>
      <button type="button" data-close-editor>Cancel</button>
    </div>
  </form>
</section>
{{end}}

{{define "saved"}}
<div id="editor" hx-swap-oob="true"></div>
<div id="results" hx-swap-oob="true">{{template "results" .}}</div>
{{end}}
