{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{{.Title}} · expense-tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  {{if .SignedIn}}
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>expense-tracker
    </a>
    <nav class="nav">
      <a href="/" class="{{if eq .Nav "expenses"}}active{{end}}">Expenses</a>
      <a href="/apps" class="{{if eq .Nav "apps"}}active{{end}}">Apps</a>
      <form method="post" action="/logout">
        <button type="submit" class="ghost small">Sign out</button>
      </form>
    </nav>
  </header>
  {{end}}
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
