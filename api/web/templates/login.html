{{define "login.html"}}{{template "layout" .}}{{end}}

{{define "content"}}
<section class="login">
  {{template "logo" "large"}}
  <h1>Welcome back</h1>
  <p class="muted">Sign in to see your expenses.</p>
  {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label class="sr-only" for="email">Email</label>
    <input id="email" type="email" name="email" value="{{index .Form "email"}}" placeholder="Email" autocomplete="email" required autofocus>
    <label class="sr-only" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="primary block">Sign in</button>
  </form>
  {{if .SignupEnabled}}<p class="login-note muted">New here? <a href="/signup">Create an account</a></p>{{end}}
</section>
{{end}}
