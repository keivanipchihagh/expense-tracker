{{define "login.html"}}{{template "layout" .}}{{end}}

{{define "content"}}
<section class="login">
  {{template "logo" "large"}}
  <h1>Welcome back</h1>
  <p class="muted">Sign in to see your expenses.</p>
  {{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label class="sr-only" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="submit" class="primary block">Sign in</button>
  </form>
</section>
{{end}}
